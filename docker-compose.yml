version: '3.8'

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: penbrae_wp
      MYSQL_USER: penbrae_user
      MYSQL_PASSWORD: penbrae_local_password
      MYSQL_ROOT_PASSWORD: penbrae_root_password
    volumes:
      - penbrae_db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.7-php8.2-apache
    depends_on:
      - db
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: penbrae_user
      WORDPRESS_DB_PASSWORD: penbrae_local_password
      WORDPRESS_DB_NAME: penbrae_wp
      WORDPRESS_DEBUG: 1
    volumes:
      - penbrae_wp_core:/var/www/html
      - ./wp-content/themes/penbrae:/var/www/html/wp-content/themes/penbrae

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      - wordpress
      - db
    volumes:
      - penbrae_wp_core:/var/www/html
      - ./wp-content/themes/penbrae:/var/www/html/wp-content/themes/penbrae
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: penbrae_user
      WORDPRESS_DB_PASSWORD: penbrae_local_password
      WORDPRESS_DB_NAME: penbrae_wp
    entrypoint: >
      /bin/sh -c "
      sleep 12;
      wp core install --url='http://localhost:8080' --title='Penbrae & Co Ltd' --admin_user='penbrae_admin' --admin_password='change_me_in_prod' --admin_email='editorial@penbrae.co.uk' --skip-email --allow-root;
      wp plugin install woocommerce --activate --allow-root;
      wp theme activate penbrae --allow-root;
      wp option update woocommerce_currency 'GBP' --allow-root;
      wp option update woocommerce_store_city 'Cardiff' --allow-root;
      wp option update woocommerce_default_country 'GB' --allow-root;
      wp rewrite structure '/%postname%/' --hard --allow-root;
      wp eval 'if ( function_exists( \"penbrae_seed_sample_architecture\" ) ) { penbrae_seed_sample_architecture(); }' --allow-root;
      "

volumes:
  penbrae_db_data:
  penbrae_wp_core:
